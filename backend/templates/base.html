<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶叶拼配审评台</title>
  <style>
    body { font-family: "Palatino Linotype", serif; background: #f6f1e7; color: #3f2e22; margin: 0; }
    header { background: #6b3e26; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
    header a { color: #f6e7c1; }
    main { max-width: 860px; margin: 20px auto; }
    table { width: 100%; background: #fffaf3; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #e6d3c0; text-align: left; vertical-align: top; }
    form { background: #fffaf3; padding: 12px; margin-bottom: 16px; }
    td form { padding: 0; margin: 0; background: none; }
    .pass { color: #166534; } .fail { color: #9f1239; }
    .ref { font-size: 12px; color: #7a5a40; margin-top: 4px; }
    .open-return { color: #92400e; font-weight: bold; white-space: nowrap; }
    .reason { font-size: 12px; color: #7a5a40; margin-top: 4px; }
    .chain { background: #fffaf3; border: 1px solid #e6d3c0; margin-bottom: 18px; padding: 14px; }
    .chain-head { font-size: 16px; font-weight: bold; display: flex; gap: 10px; align-items: center; }
    .chain-meta { color: #7a5a40; font-size: 13px; margin: 4px 0 10px; }
    .status { font-size: 12px; padding: 1px 8px; border-radius: 10px; }
    .st-open { background: #fef3c7; color: #92400e; }
    .st-closed { background: #dcfce7; color: #166534; }
    .chain-node { border-left: 3px solid #b08968; padding: 6px 12px; margin: 6px 0; background: #fff; }
    .chain-node.new { border-left-color: #166534; }
    .chain-node p { margin: 4px 0; }
    .arrow { color: #7a5a40; margin: 2px 0 2px 12px; }
    .pending { color: #92400e; font-style: italic; }
    .by { font-size: 12px; color: #8a7563; }
  </style>
</head>
<body>
  <header>
    <strong>茶叶拼配审评台</strong>
    {% if session.user %}
      <a href="{{ url_for('home') }}">审评台</a>
      <a href="{{ url_for('returns_page') }}">退回链</a>
      <span>{{ session.user }}</span>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      const append = form.dataset.swap;
      const replaceSel = form.dataset.replace;
      if (!append && !replaceSel) return;
      event.preventDefault();
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "HX-Request": "true" },
      });
      const html = await res.text();
      if (!res.ok) { alert(html); return; }
      if (replaceSel) {
        const old = document.querySelector(replaceSel);
        if (old) old.outerHTML = html;
      } else {
        document.querySelector("#rows").insertAdjacentHTML("afterbegin", html);
        form.reset();
      }
    });
  </script>
</body>
</html>
